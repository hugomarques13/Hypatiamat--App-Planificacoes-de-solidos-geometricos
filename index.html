<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phaser 3D Cube</title>

  <link href="https://fonts.cdnfonts.com/css/snap-itc" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: relative;
      background-color: white;
    }
    
    /* Preload background that shows immediately */
    #preload-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('assets/background.png') center/cover no-repeat;
      background-size: 1024px 600px;
      background-position: center;
      z-index: 1000;
      transition: opacity 0.5s;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    /* Loading spinner */
    .loader {
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top: 5px solid #e07812;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      position: absolute;
      bottom: 20%;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* Hide when game loads */
    #preload-bg.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    
    /* Game canvas styling */
    canvas {
      position: relative;
      z-index: 1;
      border-radius: 50px;
      overflow: hidden;
    }

    .slider-container {
      position: absolute;
      top: 40px;
      right: 40px;
      width: 220px;
      padding: 16px 20px;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(224, 120, 18, 0.5);
      z-index: 1001;
      user-select: none;
    }

    .slider-label {
      color: #e07812;
      margin-bottom: 12px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: 600;
      font-size: 16px;
      text-align: center;
      text-shadow: none;
    }

    .custom-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 12px;
      border-radius: 8px;
      background: #ccc;
      outline: none;
      transition: opacity 0.2s;
      cursor: pointer;
      --thumb-size: 24px;
    }
    .custom-slider:hover {
      opacity: 0.85;
    }
    .custom-slider:active {
      opacity: 1;
    }
    .custom-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: var(--thumb-size);
      height: var(--thumb-size);
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(251, 164, 52, 0.8);
      transition: background 0.3s, transform 0.2s;
    }
    .custom-slider::-webkit-slider-thumb:hover {
      background: #fba434;
      transform: scale(1.15);
      box-shadow: 0 0 14px rgba(251, 164, 52, 1);
    }
    .custom-slider::-moz-range-thumb {
      width: var(--thumb-size);
      height: var(--thumb-size);
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(251, 164, 52, 0.8);
      transition: background 0.3s, transform 0.2s;
    }
    .custom-slider::-moz-range-thumb:hover {
      background: #fba434;
      transform: scale(1.15);
      box-shadow: 0 0 14px rgba(251, 164, 52, 1);
    }
  </style>
</head>
<body>
  <!-- Preload background that shows immediately -->
  <div id="preload-bg">
    <div class="loader"></div>
  </div>
  
  <!-- Your game will load here -->
  <script type="module" src="./main.js"></script>
  
  <script>
    // Hide preload background when game is ready
    window.addEventListener('phaser-ready', () => {
      const preloadBg = document.getElementById('preload-bg');
      preloadBg.classList.add('fade-out');
      
      // Remove after animation completes
      setTimeout(() => {
        preloadBg.remove();
      }, 500);
    });
  </script>
</body>
</html>
