<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Phaser 3D Cube</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      justify-content: center;
      background-color: white;
      border-radius: 50px;
      overflow: hidden;
      touch-action: manipulation;
    }

    canvas {
      display: block;
    }

    /* Slider styles for desktop */
    .slider-container {
      position: absolute;
      top: 40px;
      right: 20px;
      width: 200px;
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(224, 120, 18, 0.5);
      z-index: 1001;
      user-select: none;
      transition: all 0.3s ease;
    }

    .slider-label {
      color: #e07812;
      margin-bottom: 8px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: 600;
      font-size: 16px;
      text-align: center;
    }

    .custom-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 12px;
      border-radius: 8px;
      background: #ccc;
      outline: none;
      transition: opacity 0.2s;
      cursor: pointer;
      --thumb-size: 24px;
    }

    .custom-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: var(--thumb-size);
      height: var(--thumb-size);
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(251, 164, 52, 0.8);
      transition: background 0.3s, transform 0.2s;
    }

    .custom-slider::-webkit-slider-thumb:hover {
      background: #fba434;
      transform: scale(1.15);
      box-shadow: 0 0 14px rgba(251, 164, 52, 1);
    }

    .custom-slider::-moz-range-thumb {
      width: var(--thumb-size);
      height: var(--thumb-size);
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(251, 164, 52, 0.8);
      transition: background 0.3s, transform 0.2s;
    }

    .custom-slider::-moz-range-thumb:hover {
      background: #fba434;
      transform: scale(1.15);
      box-shadow: 0 0 14px rgba(251, 164, 52, 1);
    }

    /* Mobile-specific styles */
    @media screen and (max-width: 767px) {
      .slider-container {
        bottom: 70px;
        left: 50%;
        transform: translateX(-50%);
        width: 80%;
        max-width: 400px;
        top: auto;
        right: auto;
      }

      .slider-label {
        font-size: 14px;
      }

      .custom-slider {
        height: 25px;
      }

      .custom-slider::-webkit-slider-thumb {
        width: 28px;
        height: 28px;
      }

      .custom-slider::-moz-range-thumb {
        width: 28px;
        height: 28px;
      }
    }

    /* Prevent zoom on input focus in mobile */
    @media screen and (max-width: 767px) {
      input, select, textarea {
        font-size: 16px;
      }
    }

    /* Fullscreen adjustments */
    :-webkit-full-screen .slider-container {
      right: 20px !important;
      top: 20px !important;
      bottom: auto !important;
      left: auto !important;
      transform: none !important;
    }

    :-moz-full-screen .slider-container {
      right: 20px !important;
      top: 20px !important;
      bottom: auto !important;
      left: auto !important;
      transform: none !important;
    }

    :-ms-fullscreen .slider-container {
      right: 20px !important;
      top: 20px !important;
      bottom: auto !important;
      left: auto !important;
      transform: none !important;
    }

    :fullscreen .slider-container {
      right: 20px !important;
      top: 20px !important;
      bottom: auto !important;
      left: auto !important;
      transform: none !important;
    }
  </style>
</head>
<body>
  <script type="module" src="./main.js"></script>
</body>
</html>
